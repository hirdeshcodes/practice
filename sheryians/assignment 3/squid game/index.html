<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="Vision">
      <div class="ver">SQUID</div>
      <div class="hor">GAME</div>
      <div class="nav">
        <div class="logo">
          <img src="./resources/logo.png" alt="" />
        </div>
        <div class="links">
          <span>About</span>
          <span>Watch now</span>
          <span>Actors</span>
          <span>Contact</span>
        </div>
        <div class="burg">
          <i class="ri-menu-3-line"></i>
        </div>
      </div>
      <div class="hero">
        <div class="left">
          <img src="./resources/logo.png" alt="" />
          <span
            >Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br />Season
            1: 9 Episodes</span
          >
          <div class="but">
            <div class="button1">
              <i class="ri-play-fill"></i>
              Play Now
            </div>
            <div class="button2">
              <i class="ri-play-line"></i>
              Watch Trailer
            </div>
          </div>
        </div>
        <div class="right">
          <img src="./resources/main.png" alt="" />
        </div>
      </div>
      <div class="bottom">
        <img src="./resources/v1.jpg" alt="" />
        <img src="./resources/v2.jpg" alt="" />
        <img src="./resources/v3.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
